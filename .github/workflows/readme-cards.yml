name: Update README cards

on:
  schedule:
    - cron: "0 3 * * *"   
  workflow_dispatch:      

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Metrics languages
        uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          user: DMarzzucco
          filename: profile/languages.svg
          base: ""
          repositories_affiliations: owner, collaborator, organization_member
          repositories_forks: yes
          plugin_languages: yes
          plugin_languages_sections: most-used, recently-used
          plugin_languages_details: percentage, bytes-size
          plugin_languages_limit: 8
          plugin_languages_recent_days: 90
          plugin_languages_recent_load: 500

      #- name: Top languages (por cantidad de repos)
      #  uses: stats-organization/github-readme-stats-action@v2
      #  with:
       #   card: top-langs
        #  options: username=DMarzzucco&layout=donut&theme=onedark&size_weight=0&count_weight=1&hide_border=true
         # path: profile/top-langs.svg
          #token: ${{ secrets.GITHUB_TOKEN }}

      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add profile/*.svg
          git commit -m "Update README cards" || exit 0
          git push
